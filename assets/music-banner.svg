<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="700" height="120" viewBox="0 0 700 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140e1b" />
      <stop offset="50%" stop-color="#1b1224" />
      <stop offset="100%" stop-color="#0e0a14" />
    </linearGradient>

    <!-- Animated Text Gradient -->
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fc77a6">
        <animate attributeName="stop-color" values="#fc77a6;#7fffff;#ff3366;#fc77a6" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7fffff">
        <animate attributeName="stop-color" values="#7fffff;#ff3366;#fc77a6;#7fffff" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#fc77a6">
        <animate attributeName="stop-color" values="#fc77a6;#7fffff;#ff3366;#fc77a6" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Visualizer Bar Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fc77a6" />
      <stop offset="100%" stop-color="#7fffff" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes eq1 { 0%, 100% { height: 12px; y: 92px; } 50% { height: 46px; y: 58px; } }
      @keyframes eq2 { 0%, 100% { height: 36px; y: 68px; } 50% { height: 14px; y: 90px; } }
      @keyframes eq3 { 0%, 100% { height: 18px; y: 86px; } 50% { height: 56px; y: 48px; } }
      @keyframes eq4 { 0%, 100% { height: 50px; y: 54px; } 50% { height: 22px; y: 82px; } }
      @keyframes eq5 { 0%, 100% { height: 10px; y: 94px; } 50% { height: 38px; y: 66px; } }

      @keyframes pulseRing {
        0%, 100% { stroke: #fc77a6; }
        50% { stroke: #7fffff; }
      }

      @keyframes spinVinyl {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .bar {
        transform-origin: bottom;
        rx: 2.5px;
      }
      .b1 { animation: eq1 1.1s ease-in-out infinite; }
      .b2 { animation: eq2 0.85s ease-in-out infinite; }
      .b3 { animation: eq3 1.3s ease-in-out infinite; }
      .b4 { animation: eq4 1.0s ease-in-out infinite; }
      .b5 { animation: eq5 0.75s ease-in-out infinite; }

      .pulse-border {
        animation: pulseRing 3.5s ease-in-out infinite;
      }

      .vinyl-disc {
        transform-origin: 62px 60px;
        animation: spinVinyl 6s linear infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="696" height="116" rx="16" fill="url(#bgGrad)" stroke="#331e42" stroke-width="2" />

  <!-- LEFT: Spinning Vinyl / Music Artwork -->
  <g class="pulse-border">
    <rect class="pulse-border" x="22" y="20" width="80" height="80" rx="16" fill="#1b1224" stroke="#fc77a6" stroke-width="2" filter="url(#glow)" />
  </g>

  <!-- Spinning Vinyl Record inside box -->
  <g class="vinyl-disc">
    <circle cx="62" cy="60" r="32" fill="#110d17" stroke="#2c1a3b" stroke-width="1.5" />
    <circle cx="62" cy="60" r="26" fill="none" stroke="#251633" stroke-width="1" stroke-dasharray="4 2" />
    <circle cx="62" cy="60" r="20" fill="none" stroke="#2e1b3d" stroke-width="1" />
    <circle cx="62" cy="60" r="14" fill="#fc77a6" />
    <circle cx="62" cy="60" r="5" fill="#110d17" />
  </g>

  <!-- Musical Note Icon overlay in center -->
  <path d="M 60 55 L 60 63 A 3 3 0 1 1 57 60 L 60 60 L 65 53 L 65 59 A 3 3 0 1 1 62 56 L 65 56 L 65 52 Z" fill="#7fffff" opacity="0.9" />

  <!-- MIDDLE: Track Info -->
  <!-- Pill badge: QUARTER LIFE CRISIS -->
  <rect x="118" y="20" width="168" height="18" rx="9" fill="#261633" stroke="#fc77a6" stroke-width="1" />
  <circle cx="127" cy="29" r="3.5" fill="#7fffff">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <text x="135" y="32.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="9" font-weight="700" fill="#7fffff" letter-spacing="1">
    QUARTER LIFE CRISIS
  </text>

  <!-- TRACK 1: Difficult - Gracie Abrams (Alternating fade) -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="9s" repeatCount="indefinite" />
    <text x="118" y="56" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="18" font-weight="800" fill="url(#gradText)" letter-spacing="0.8">
      Difficult
    </text>
    <text x="118" y="74" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12" font-weight="500" fill="#cfb6db">
      Gracie Abrams <tspan fill="#7d648b">•</tspan> Good Riddance
    </text>
  </g>

  <!-- TRACK 2: 20s - Bow Anderson (Alternating fade) -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="9s" repeatCount="indefinite" />
    <text x="118" y="56" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="18" font-weight="800" fill="url(#gradText)" letter-spacing="0.8">
      20s
    </text>
    <text x="118" y="74" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12" font-weight="500" fill="#cfb6db">
      Bow Anderson <tspan fill="#7d648b">•</tspan> Single
    </text>
  </g>

  <!-- Scrubber / Player Controls -->
  <text x="118" y="96" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="10" font-weight="600" fill="#fc77a6">
    01:28
  </text>
  <rect x="150" y="91" width="170" height="4" rx="2" fill="#2d1d3a" />
  <rect x="150" y="91" width="85" height="4" rx="2" fill="url(#barGrad)" />
  <circle cx="235" cy="93" r="4" fill="#7fffff" filter="url(#glow)" />
  <text x="326" y="96" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="10" font-weight="500" fill="#8e769b">
    03:30
  </text>

  <!-- RIGHT: Equalizer Bars (19 Bars) -->
  <g fill="url(#barGrad)">
    <rect class="bar b1" x="430" y="80" width="5.5" height="24" />
    <rect class="bar b3" x="442" y="65" width="5.5" height="39" />
    <rect class="bar b2" x="454" y="75" width="5.5" height="29" />
    <rect class="bar b4" x="466" y="58" width="5.5" height="46" />
    <rect class="bar b5" x="478" y="84" width="5.5" height="20" />
    <rect class="bar b2" x="490" y="68" width="5.5" height="36" />
    <rect class="bar b1" x="502" y="72" width="5.5" height="32" />
    <rect class="bar b3" x="514" y="52" width="5.5" height="52" />
    <rect class="bar b4" x="526" y="62" width="5.5" height="42" />
    <rect class="bar b5" x="538" y="78" width="5.5" height="26" />
    <rect class="bar b1" x="550" y="66" width="5.5" height="38" />
    <rect class="bar b2" x="562" y="48" width="5.5" height="56" />
    <rect class="bar b3" x="574" y="60" width="5.5" height="44" />
    <rect class="bar b4" x="586" y="74" width="5.5" height="30" />
    <rect class="bar b2" x="598" y="64" width="5.5" height="40" />
    <rect class="bar b5" x="610" y="82" width="5.5" height="22" />
    <rect class="bar b1" x="622" y="56" width="5.5" height="48" />
    <rect class="bar b3" x="634" y="70" width="5.5" height="34" />
    <rect class="bar b4" x="646" y="60" width="5.5" height="44" />
    <rect class="bar b2" x="658" y="76" width="5.5" height="28" />
    <rect class="bar b5" x="670" y="85" width="5.5" height="19" />
  </g>
</svg>
