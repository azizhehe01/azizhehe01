name: Update Streak Stats

on:
  schedule:
    - cron: "0 0 * * *" # Update tiap hari jam 00:00 UTC (07:00 WIB)
  workflow_dispatch: # Bisa di-trigger manual lewat tombol Run workflow
  push:
    branches:
      - main
    paths:
      - ".github/workflows/streak-stats.yml"

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          token: ${{ secrets.STREAK_STATS_TOKEN }}
          options: "user=azizhehe01&theme=dark&hide_border=true&background=0D1117&ring=45FF08&fire=45FF08&currStreakLabel=45FF08&sideLabels=C9D1D9&dates=8B949E&timezone=Asia%2FJakarta"
          path: assets/streak.svg

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f assets/streak.svg ]; then
            git add assets/streak.svg
            git commit -m "chore: update streak stats [skip ci]" || exit 0
            git push
          fi
